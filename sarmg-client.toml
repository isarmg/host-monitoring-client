format = 1
product_id = "host-monitoring"
source_roots = ["src"]

# Development workspace identity; not an immutable release pin.
[foundation]
platform_generation = 1
version = "0.7.0"

[[components]]
id = "client"
profile = "desktop-client"
capabilities = ["private-state", "bounded-spool", "https-delivery", "doctor", "local-web-management"]

[components.client_limits]
max_record_bytes = 524288
max_spool_bytes = 268435456
max_spool_entries = 4096
