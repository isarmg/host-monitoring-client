[package]
name = "xsoc"
description = "Read-only cross-platform host telemetry client for xsos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
default-run = "xsoc"

[features]
# The installed daemon/CLI is a desktop capability. Mobile applications embed
# the library with `--no-default-features` and drive collection, scheduling,
# transport, and credential storage through their native host.
default = ["desktop", "nvidia"]
desktop = [
    "dep:libc",
    "dep:rand",
    "dep:xcsc-cli",
    "dep:xcsc-error",
    "dep:xcsc-runtime",
    "dep:xcsc-secret",
    "dep:xcsc-fs-safety",
    "dep:reqwest",
    "dep:url",
    "dep:sha2",
    "dep:sysinfo",
    "dep:tokio",
    "dep:tracing",
    "dep:xcss-log",
    "dep:tracing-subscriber",
    "dep:windows",
    "dep:windows-sys",
    "dep:zeroize",
]
nvidia = ["desktop", "dep:nvml-wrapper"]
# OTLP 导出。手写的 protobuf 子集在 `otlp.rs`，由专用测试对真实 Collector 验证。
# flate2 也一并门控：关掉 otlp 时不应把 gzip 编码器编进二进制。
otlp = ["desktop", "dep:prost", "dep:flate2"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
flate2 = { version = "1", optional = true }
nvml-wrapper = { version = "0.12", optional = true }
prost = { version = "0.14", optional = true }
rand = { version = "0.10", optional = true }
serde.workspace = true
serde_json.workspace = true
xcsc-cli = { workspace = true, optional = true }
xcsc-error = { workspace = true, optional = true }
xcsc-runtime = { workspace = true, optional = true }
xcsc-secret = { workspace = true, optional = true }
xcsc-fs-safety = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["http2"], optional = true }
url = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"], optional = true }
thiserror.workspace = true
tokio = { version = "~1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"], optional = true }
xcss-log = { git = "https://github.com/isarmg/xcss.git", rev = "d58b9ef0822984ee0d29fb8b8139cfd2787374fb", version = "=1.0.0", features = ["tracing"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
xsos-protocol.workspace = true
uuid.workspace = true
zeroize = { version = "1.9.1", features = ["serde"], optional = true }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"], optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"], optional = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
rcgen = "0.14"
rustls = "0.23"
tempfile = "3"
tokio = { version = "~1.53.2", features = ["test-util"] }

[[test]]
name = "explicit_config"
required-features = ["desktop"]

[[test]]
name = "pairing_transport_policy"
required-features = ["desktop"]

[[test]]
name = "status_active_binding"
required-features = ["desktop"]

[[test]]
name = "otlp_encoding"
required-features = ["desktop", "otlp"]

[[test]]
name = "otlp_live"
required-features = ["desktop", "otlp"]

[[bin]]
name = "xsoc"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "xsoc-maintenance"
path = "src/bin/xsoc-maintenance.rs"
required-features = ["desktop"]

[workspace]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/xsoc"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xsos-protocol = { git = "https://github.com/isarmg/xsos.git", rev = "44e2090f113a78d38b26d59c638756de37c60383", version = "=1.0.0" }
xcsc-cli = { git = "https://github.com/isarmg/xcsc.git", rev = "a3c827b7f0f69d84ff69f72be1533a7171ab63d6", version = "=1.0.0" }
xcsc-runtime = { git = "https://github.com/isarmg/xcsc.git", rev = "a3c827b7f0f69d84ff69f72be1533a7171ab63d6", version = "=1.0.0" }
xcsc-secret = { git = "https://github.com/isarmg/xcsc.git", rev = "a3c827b7f0f69d84ff69f72be1533a7171ab63d6", version = "=1.0.0" }
uuid = { version = "1", features = ["serde", "v4"] }


[workspace.dependencies.xcsc-error]
git = "https://github.com/isarmg/xcsc.git"
rev = "a3c827b7f0f69d84ff69f72be1533a7171ab63d6"
version = "=1.0.0"

[workspace.dependencies.xcsc-fs-safety]
git = "https://github.com/isarmg/xcsc.git"
rev = "a3c827b7f0f69d84ff69f72be1533a7171ab63d6"
version = "=1.0.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints]
workspace = true
